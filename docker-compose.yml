services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdaka_shop
      POSTGRES_USER: bdaka
      POSTGRES_PASSWORD: bdaka_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
volumes:
  postgres_data:
